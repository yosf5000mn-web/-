services:
  - type: web
    name: raqmyat-technology
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter
    disk:
      name: raqmyat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_PATH
        value: /var/data/raqmyat.db
      - key: SECRET_KEY
        generateValue: true
