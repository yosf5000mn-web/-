{% extends "base.html" %}{% block title %}تسجيل الدخول | رقميات{% endblock %}
{% block content %}
<section class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="{{ url_for('static', filename='logo.jpg') }}" alt="رقميات">
    <h1>أهلاً بك في رقميات</h1><p class="muted">سجّل الدخول للمتابعة إلى لوحة الموقع</p>
    <form method="post" class="stack">
      <label>اسم المستخدم<input name="username" autocomplete="username" required placeholder="اسم المستخدم"></label>
      <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required placeholder="كلمة المرور"></label>
      <button class="primary wide">تسجيل الدخول</button>
    </form>
    <p class="hint">للدخول الأول كمدير: admin / 123123</p>
  </div>
</section>
{% endblock %}
